name: CI

# Runs on every push/PR: backend import + pytest, frontend build + unit
# tests. Deliberately minimal (no deploy step, no Docker build) - this is a
# local-first department tool, not a hosted service; the goal here is just
# to catch a broken `main`/PR before someone pulls it onto a lab PC.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import sanity check
        run: python -c "import main; print('backend imports OK,', len(main.app.routes), 'routes')"

      - name: Run pytest
        run: python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run

      - name: Production build
        run: npm run build
